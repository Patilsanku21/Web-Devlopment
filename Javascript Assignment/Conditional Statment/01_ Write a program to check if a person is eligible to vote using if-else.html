<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age</title>
</head>
<body>
    <script>
        let age = parseInt(prompt("Enter Your Age"));

        if(age >= 18)

        console.log("You Are eligible For Vote");
    }
    else{
        console.log("You Are Not eligible for Vote");
    }
    </script>
