<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex-shrink</title>
    <style>
        .container{
            display:flex ;
            width: 250px;
            
            
        }
        .items1{
            width: 100px;
            flex-shrink: 0;
            background-color: blueviolet;
        }
        .items2{
            width: 100px;
            background-color: cadetblue;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="items1">1</div>
        <div class="items2">2</div>
    </div>
</body>
</html>
