<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position</title>
    <style>
        .box{
            position: absolute;
            height: 100px;
            width: 100px;
            background-color: aqua;
        }
        .child{
            position: absolute;
            top: 10px;
            right: 20px;
            background-color: blue;
        }
    </style>
</head>
<body>
    <div class="box">parent
        <div class="child">child</div>
    </div>
</body>
</html>
