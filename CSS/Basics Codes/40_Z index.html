<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box1{
            position: absolute;
            z-index: z;
            left: 60px;
            top: 60px;
            height: 150px;
            width: 150px;
            background-color: coral;

        }
        .box2{
            position: absolute;
            left: 95px;
            top: 80px;
            height: 150px;
            width: 150px;
            background-color: darkviolet;
            z-index: z;
        }
        .box3{
            position: absolute;
            left: 105px;
            top: 105px;
            height:150px;
            width: 150px;
            z-index: z;
            background-color:darkseagreen;
        }
    </style>
</head>
<body>
    <div class="box1">Box 1</div>
    <div class="box2">Box 2</div>
    <div class="box3">Box 3</div>
</body>
</html>
