<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>
<style>
  :root{
    --bg:rgb(199, 73, 94);
    --panel:navy;
    --display:white;
    --accent:orange;
    --key:white;
    --key-hover:white;
   --op:rgba(175, 21, 106, 0.795);
    --op-hover:aqua;
    --text:black;
    --muted:navy;
  }

  * { box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background: radial-gradient(circle at 30% 20%, white);
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
  }

  .calc{
    width: 320px;
    background: var(--panel);
    border-radius: 24px;
    padding: 22px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.03);
  }

  .display{
    background: var(--display);
    border-radius: 16px;
    padding: 22px 18px 16px;
    margin-bottom: 18px;
    text-align: right;
    overflow: hidden;
  }

  .expression{
    color: var(--muted);
    font-size: 14px;
    min-height: 18px;
    letter-spacing: 0.5px;
  }

  .result{
    color: var(--text);
    font-size: 40px;
    font-weight: 600;
    margin-top: 6px;
    white-space: nowrap;
    overflow-x: auto;
  }

  .keys{
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }

  button{
    border: none;
    border-radius: 14px;
    padding: 18px 0;
    font-size: 18px;
    font-weight: 500;
    background: var(--key);
    color: var(--text);
    cursor: pointer;
    transition: background 0.15s ease, transform 0.05s ease;
  }

  button:hover{ background: var(--key-hover); }
  button:active{ transform: scale(0.95); }

  .op{ background: var(--op); color: var(--accent); }
  .op:hover{ background: var(--op-hover); }

  .equals{
    background: var(--accent);
    color: #1b1d23;
    grid-row: span 1;
  }
  .equals:hover{ filter: brightness(1.08); background: var(--accent); }

  .zero{ grid-column: span 2; }

  .clear, .back{
    background: var(--key);
    color: #e07b5f;
  }
</style>
</head>
<body>

<div class="calc">
  <div class="display">
    <div class="expression" id="expression">&nbsp;</div>
    <div class="result" id="result">0</div>
  </div>

  <div class="keys">
    <button class="clear" onclick="clearAll()">AC</button>
    <button class="back" onclick="backspace()">⌫</button>
    <button class="op" onclick="chooseOperator('%')">%</button>
    <button class="op" onclick="chooseOperator('/')">÷</button>

    <button onclick="appendNumber('7')">7</button>
    <button onclick="appendNumber('8')">8</button>
    <button onclick="appendNumber('9')">9</button>
    <button class="op" onclick="chooseOperator('*')">×</button>

    <button onclick="appendNumber('4')">4</button>
    <button onclick="appendNumber('5')">5</button>
    <button onclick="appendNumber('6')">6</button>
    <button class="op" onclick="chooseOperator('-')">−</button>

    <button onclick="appendNumber('1')">1</button>
    <button onclick="appendNumber('2')">2</button>
    <button onclick="appendNumber('3')">3</button>
    <button class="op" onclick="chooseOperator('+')">+</button>

    <button class="zero" onclick="appendNumber('0')">0</button>
    <button onclick="appendNumber('.')">.</button>
    <button class="equals" onclick="calculate()">=</button>
  </div>
</div>

<script>
  let current = '0';
  let previous = '';
  let operator = null;
  let resetNext = false;

  const resultEl = document.getElementById('result');
  const expressionEl = document.getElementById('expression');

  function updateDisplay(){
    resultEl.textContent = current;
    expressionEl.textContent = previous
      ? `${previous} ${symbolFor(operator)}`
      : '\u00A0';
  }

  function symbolFor(op){
    return { '+':'+', '-':'−', '*':'×', '/':'÷', '%':'%' }[op] || '';
  }

  function appendNumber(num){
    if (resetNext){
      current = '0';
      resetNext = false;
    }
    if (num === '.' && current.includes('.')) return;
    if (current === '0' && num !== '.'){
      current = num;
    } else {
      current += num;
    }
    updateDisplay();
  }

  function chooseOperator(op){
    if (operator && !resetNext){
      calculate();
    }
    previous = current;
    operator = op;
    resetNext = true;
    updateDisplay();
  }

  function calculate(){
    if (!operator || resetNext) return;
    const a = parseFloat(previous);
    const b = parseFloat(current);
    let res;
    switch(operator){
      case '+': res = a + b; break;
      case '-': res = a - b; break;
      case '*': res = a * b; break;
      case '/': res = b === 0 ? NaN : a / b; break;
      case '%': res = a % b; break;
    }
    current = Number.isNaN(res) ? 'Error' : String(parseFloat(res.toFixed(10)));
    operator = null;
    previous = '';
    resetNext = true;
    updateDisplay();
  }

  function clearAll(){
    current = '0';
    previous = '';
    operator = null;
    resetNext = false;
    updateDisplay();
  }

  function backspace(){
    if (resetNext) return;
    current = current.length > 1 ? current.slice(0, -1) : '0';
    updateDisplay();
  }

  document.addEventListener('keydown', (e) => {
    if (e.key >= '0' && e.key <= '9') appendNumber(e.key);
    else if (e.key === '.') appendNumber('.');
    else if (['+','-','*','/'].includes(e.key)) chooseOperator(e.key);
    else if (e.key === 'Enter' || e.key === '=') calculate();
    else if (e.key === 'Backspace') backspace();
    else if (e.key === 'Escape') clearAll();
  });

  updateDisplay();
</script>

</body>
</html>
