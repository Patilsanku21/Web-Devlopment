<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Percenage</title>
</head>
<body>
    <script>
        let Marks = parseInt(prompt("Enter a Marks"));

        if(Marks >= 90)
    {
        console.log("Grade : A");
    }
    else if(Marks >= 70)
    {
        console.log("Grade : B");
    }
    else if(Marks >= 60)
    {
        console.log("Grade : C");
    }
    else if(Marks >= 40)
    {
        console.log("Grade : F");
    }
    </script>
</body>
</html>
