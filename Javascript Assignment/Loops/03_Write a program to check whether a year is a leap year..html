<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>leap Year and Not</title>
</head>
<body>
    <script>
        let year = parseInt(prompt("Enter a Year"));

        if(year % 4 === 0)
    {
        console.log("year + is a Leap year");
    }
    else 
    {
        console.log("year + is a Not Leap year");
    }
    </script>
</body>
</html>
