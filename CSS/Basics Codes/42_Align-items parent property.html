<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Align items parent property</title>
    <style>
        .container{
            display: flex;
            height: 150px;
            align-items: baseline;
            align-items: end;
            align-items: center;
            align-items: first baseline;
            align-items: stretch;
            background-color: hotpink;
        }
        .items{
            background-color: cadetblue;
            height: 80px;
            width: 80px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="items">1</div>
        <div class="items">2</div>
        <div class="items">3</div>
        <div class="items">4</div>
    </div>
</body>
</html>
