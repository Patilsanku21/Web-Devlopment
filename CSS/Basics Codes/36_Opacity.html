<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opacity Example</title>
    <style>
        .box{
            opacity: 0.3;
            background-color: darkred;
            padding: 10px;
            color: white;
        }
        .card{
            background-color: darkred;
            padding: 10px;
            color: white;
        }
    </style>
</head>
<body>
    <div class="box">Opacity Example</div>
    <div class="card">opacity Example</div>
</body>
</html>
