<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block</title>
    <style>
        .box {
            display: block;
            background-color: coral;
            margin: 10px;
            padding: 10px;
        }
        .card{
            display: inline;
            background-color: aqua;
            padding: 10px;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="box">Book Element</div>

    <div class="card">Lorem ipsum dolor sit amet.</div>
</body>

</html>
