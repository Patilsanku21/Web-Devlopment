<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let Day = parseInt(prompt("Enter a Day(1-7)"));

        switch (Day)
        {
            case 1 :
                console.log("Monday");
                break;

            case 2 :
                console.log("Tuesday");
                break;

            case 3 :
                console.log("Wensday");
                break;
            case 4:
                console.log("Thursday");
                break;
            case 5 :
                console.log("Friday");
                break;
            case 6 :
                console.log("Saturady");
                break;
            case 7 :
                console.log("Sunday");
                break;
            default:
                console.log("Invalid Output,please Correct Number");
                
        }
    </script>
</body>
</html>
