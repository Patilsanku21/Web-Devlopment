<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>

    <style>
        .table{
            display: table;
            width: 100%;
            border: 2px solid balck;
            margin-top: 20px;
            text-align: center;
        }

        .row{
            display: table-row;
        }

        .col{
            display: table-cell;
            border: 1px solid black;
            padding: 10x;
            text-align: center;
        }
        .row-header{
            display: table-row;
            font-weight: bold;
            background-color: lightgray;
        }
    </style>
</head>

<body>
    <h1> Table Example</h1>

    <div class="table">

        <div class="row-header">
        <div class="col">ID</div>
        <div class="col">Name</div>
        <div class="col">City</div>
    </div>

    <div class="row">

    <div class="col">1</div>
    <div class="col">Nilesh</div>
    <div class="col">Pune</div>
    </div>

    <div class="row">

    <div class="col">2</div>
    <div class="col">Sanskruti</div>
    <div class="col">Satara</div>
    </div>
</div>
</body>

</html>
