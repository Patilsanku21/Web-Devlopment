<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex</title>
</head>
<style>
    .parent{
        display: flex;
        gap: 10px;
    }
    .child{
        background-color: bisque;
        text-align: center;
        
    }
</style>
<body>
    <div class="parent"></div>
    <div class="child">first</div>
    <div class="child">second</div>
    <div class="child">third</div>
</body>
</html>
